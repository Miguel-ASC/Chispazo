spring.application.name=chispita

server.port 8081
# Configurar atributos para mi database de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/chispazo?createDatabaseIfNotExist=true&useSSL=false 
spring.datasource.username=root
spring.datasource.password=0000

# Configuracion de la accion JPA
spring.jpa.hibernate.ddl-auto=update

# Logs para ver la informacion de las queries de JPA (dev environment)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true